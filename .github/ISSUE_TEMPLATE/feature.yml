name: 功能建议
description: 想要的新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: 想要什么
      description: 想解决什么问题、希望怎么用
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: 涉及的平台
      multiple: true
      options: [全部, 安卓, Windows, macOS, Linux, iOS]
  - type: textarea
    id: more
    attributes:
      label: 补充
      description: 参考截图、别的软件的做法等
