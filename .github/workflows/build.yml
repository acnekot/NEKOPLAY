name: 打包全部版本（安卓 / iOS / Windows / macOS / Linux）
on:
  workflow_dispatch:
    inputs:
      release:
        description: "打包后发布版本（Pre-release / 正式版）"
        type: boolean
        default: false
      tag:
        description: "自定义发布标签（留空则用 v + Version.kt 版本号，如 v0.6.8-nightly.20261126.2）"
        type: string
        default: ""
      android:
        description: "打包 Android"
        type: boolean
        default: true
      windows:
        description: "打包 Windows"
        type: boolean
        default: true
      macos:
        description: "打包 macOS"
        type: boolean
        default: true
      linux:
        description: "打包 Linux"
        type: boolean
        default: true
      ios:
        description: "打包 iOS"
        type: boolean
        default: true
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop_os: ${{ steps.calc.outputs.desktop_os }}
      has_desktop: ${{ steps.calc.outputs.has_desktop }}
    steps:
      - id: calc
        env:
          EVENT_NAME: ${{ github.event_name }}
          INC_WIN: ${{ inputs.windows }}
          INC_MAC: ${{ inputs.macos }}
          INC_LINUX: ${{ inputs.linux }}
        run: |
          OS=()
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$INC_WIN" = "true" ]; then OS+=('"windows-latest"'); fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$INC_MAC" = "true" ]; then OS+=('"macos-latest"'); fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$INC_LINUX" = "true" ]; then OS+=('"ubuntu-latest"'); fi
          if [ ${#OS[@]} -eq 0 ]; then
            echo "desktop_os=[]" >> "$GITHUB_OUTPUT"
            echo "has_desktop=false" >> "$GITHUB_OUTPUT"
          else
            IFS=,
            echo "desktop_os=[${OS[*]}]" >> "$GITHUB_OUTPUT"
            echo "has_desktop=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    if: github.event_name != 'workflow_dispatch' || inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: 解出正式签名密钥（缺少时直接失败，绝不退回每次都不同的 debug 签名）
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KS" ]; then echo "::error::缺少 ANDROID_KEYSTORE_BASE64，拒绝用 debug 签名发包（用户将无法覆盖升级）"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NEKOPLAY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: 打包 APK
        env:
          NEKOPLAY_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          NEKOPLAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEKOPLAY_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: 整理文件名
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/NEKOPLAY-android-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/NEKOPLAY-android-armv7.apk
      - name: 校验签名指纹（必须是固定的 NEKOPLAY 正式证书）
        env:
          # 公开信息：正式证书 SHA-256 指纹，更换密钥时同步修改
          EXPECTED: e1b0261b7bb94b5d4f9525757c3761672ee4a5bea5f01a14ddda58aa8d87ea9d
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in out/*.apk; do
            "$SIGNER" verify --print-certs "$f" | tee /tmp/cert.txt
            got=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk '{print $NF}')
            [ "$got" = "$EXPECTED" ] || { echo "::error::$f 签名指纹 $got 与正式证书不符"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with: { name: NEKOPLAY-Android, path: out/*.apk }

  desktop:
    needs: plan
    if: needs.plan.outputs.has_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.desktop_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }

      # 把播放内核 libmpv 放进 desktop/resources/<系统>/，安装包和免安装版都会带上
      # 用 media-kit 固定版本的纯音频 libmpv（仅 ~15MB、无视频/LuaJIT/VapourSynth 组件、已有多年全球信誉），
      # 避开 shinchiro 每日构建（~80MB、无信誉）频繁被 Windows 安全中心误报隔离的问题
      - name: 准备 libmpv（Windows）
        if: runner.os == 'Windows'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p desktop/resources/windows mpvtmp
          gh release download 2023-09-24 -R media-kit/libmpv-win32-audio-build --pattern "mpv-dev-x86_64-*.7z" -D mpvtmp
          7z e mpvtmp/*.7z -omp libmpv-2.dll -r -y
          cp mp/libmpv-2.dll desktop/resources/windows/
      # 用 media-kit 编好的 libmpv（只含音频、通用二进制、最低 macOS 11）。
      # 以前用 Homebrew 的，那些库要求和打包机一样新的系统（现在是 macOS 26），旧系统上加载失败
      - name: 准备 libmpv（macOS）
        if: runner.os == 'macOS'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p desktop/resources/macos mpvtmp
          gh release download v0.7.3 -R media-kit/libmpv-darwin-build --pattern "libmpv-libs_v0.7.3_macos-universal-audio-default.tar.gz" -D mpvtmp
          tar xzf mpvtmp/*.tar.gz -C mpvtmp
          cp mpvtmp/libmpv-libs_*/*.dylib desktop/resources/macos/
          cd desktop/resources/macos
          # 依赖都写成 @rpath/xxx.dylib：给每个库加上「自己所在目录」作为搜索路径
          for f in *.dylib; do chmod u+w "$f"; install_name_tool -add_rpath @loader_path "$f" 2>/dev/null || true; done
          codesign --force -s - ./*.dylib
          for f in *.dylib; do vtool -show-build "$f" | grep -m1 minos; done
      - name: 准备 libmpv（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libmpv-dev patchelf
          D=desktop/resources/linux; mkdir -p $D
          cp -L "$(ldconfig -p | awk '/libmpv\.so\.2 .*x86-64/{print $NF; exit}')" $D/libmpv.so.2
          ldd $D/libmpv.so.2 | awk '/=> \//{print $3}' \
            | grep -vE '/(libc|libm|libdl|libpthread|librt|libresolv|ld-linux[^/]*|libstdc\+\+|libgcc_s|libGL[^/]*|libEGL|libGLX|libGLdispatch|libX[^/]*|libxcb[^/]*|libwayland[^/]*|libdrm|libgbm|libasound|libpulse[^/]*|libsystemd|libdbus[^/]*|libudev|libz|libexpat|libffi|libselinux|libpcre2[^/]*)\.so' \
            | xargs -I{} cp -L {} $D/
          patchelf --set-rpath '$ORIGIN' $D/*.so*

      - name: 编译原生 VST 宿主库（Windows / macOS / Linux）
        shell: bash
        run: chmod +x native/vst/build.sh && ./native/vst/build.sh

      - name: 打包免安装版
        working-directory: desktop
        shell: bash
        run: chmod +x gradlew && ./gradlew createDistributable --no-daemon
      - name: 压缩免安装版
        shell: bash
        run: |
          mkdir -p out
          cd desktop/build/compose/binaries/main/app
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../../../../../../out/NEKOPLAY-${{ runner.os }}-portable.zip NEKOPLAY; else zip -qry ../../../../../../out/NEKOPLAY-${{ runner.os }}-portable.zip .; fi
      - name: 确认 WiX 3（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\WiX Toolset v3.14\bin\light.exe")) { choco install wixtoolset -y --no-progress }
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 打包安装包
        working-directory: desktop
        shell: bash
        run: ./gradlew packageDistributionForCurrentOS --no-daemon
      - name: 出错时打印 jpackage 日志
        if: failure()
        shell: bash
        run: find desktop/build/compose/logs -type f -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
      # Microsoft Store 版：渠道标记改为 store 重新打免安装目录，再用 makeappx 打成 MSIX（不签名，上传后由微软签名）
      - name: 打包 Microsoft Store 版 MSIX（Windows）
        if: runner.os == 'Windows'
        continue-on-error: true   # 商店包失败不影响直装版安装包发布
        shell: bash
        env:
          NEKOPLAY_CHANNEL: store
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY: ${{ vars.MSSTORE_PUBLISHER_DISPLAY }}
        run: |
          set -e
          app=desktop/build/compose/binaries/main/app
          rm -rf "$app"
          (cd desktop && ./gradlew createDistributable --no-daemon)
          pwsh -NoProfile -File desktop/msix/build-msix.ps1 -AppDir "$app/NEKOPLAY" -Out store/NEKOPLAY-store-x64.msix
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with: { name: store-msix, path: store/*.msix, if-no-files-found: warn }
      - name: 收集安装包
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find desktop/build/compose/binaries/main -maxdepth 2 -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" \) -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEKOPLAY-${{ runner.os }}
          path: out/*
          if-no-files-found: ignore

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    uses: ./.github/workflows/ios.yml

  # 推 v 开头的标签或手动勾选发布时：把所有已成功构建的平台产物放进同一个 GitHub Release（不因单个平台失败/取消而整包跳过）
  release:
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release) && (needs.android.result == 'success' || needs.desktop.result == 'success' || needs.ios.result == 'success')
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 版本号和这个版本的说明（从 CHANGELOG.md 取）
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_TAG" ]]; then v="${INPUT_TAG#v}"
          else v=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' shared/src/cc/catsuki/nekoplay/Version.kt); fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "见 CHANGELOG.md" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        # 只收 NEKOPLAY-* 安装包；商店版 MSIX（store-msix）不进 GitHub Release，单独手动上传到 Partner Center
        with: { path: dist, pattern: "NEKOPLAY-*", merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: NEKOPLAY v${{ steps.ver.outputs.v }}
          prerelease: ${{ contains(steps.ver.outputs.v, '-') }}
          body_path: notes.md
          files: dist/*
