name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with: { name: nekoplay-apk, path: build/app/outputs/flutter-apk/*.apk }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r nekoplay-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: nekoplay-ios-unsigned-ipa, path: nekoplay-unsigned.ipa }
