name: 打包 PC 版（Windows / macOS / Linux）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      # 0) 把播放内核 libmpv 放进 desktop/resources/<系统>/，安装包和免安装版都会带上
      - name: 准备 libmpv（Windows）
        if: runner.os == 'Windows'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p desktop/resources/windows mpvtmp
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" -D mpvtmp
          7z e mpvtmp/*.7z -omp libmpv-2.dll -r -y
          cp mp/libmpv-2.dll desktop/resources/windows/
          ls -l desktop/resources/windows
      - name: 准备 libmpv（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install mpv dylibbundler
          mkdir -p desktop/resources/macos && cd desktop/resources/macos
          cp "$(brew --prefix mpv)/lib/libmpv.2.dylib" . && chmod u+w libmpv.2.dylib
          # 把依赖的 dylib 一起拷进来，路径改成相对自己（@loader_path）
          dylibbundler -of -b -x ./libmpv.2.dylib -d . -p @loader_path/
          codesign --force -s - ./*.dylib
          ls | head -50; du -sh .
      - name: 准备 libmpv（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libmpv-dev patchelf
          D=desktop/resources/linux; mkdir -p $D
          cp -L "$(ldconfig -p | awk '/libmpv\.so\.2 .*x86-64/{print $NF; exit}')" $D/libmpv.so.2
          # 依赖一起带上；系统基础库（glibc、显卡、X11/Wayland、声音服务）用系统自己的
          ldd $D/libmpv.so.2 | awk '/=> \//{print $3}' \
            | grep -vE '/(libc|libm|libdl|libpthread|librt|libresolv|ld-linux[^/]*|libstdc\+\+|libgcc_s|libGL[^/]*|libEGL|libGLX|libGLdispatch|libX[^/]*|libxcb[^/]*|libwayland[^/]*|libdrm|libgbm|libasound|libpulse[^/]*|libsystemd|libdbus[^/]*|libudev|libz|libexpat|libffi|libselinux|libpcre2[^/]*)\.so' \
            | xargs -I{} cp -L {} $D/
          patchelf --set-rpath '$ORIGIN' $D/*.so*
          ls $D | wc -l; du -sh $D

      # 1) 免安装版：直接解压就能用，不依赖安装包工具
      - name: 打包免安装版
        working-directory: desktop
        shell: bash
        run: chmod +x gradlew && ./gradlew createDistributable --no-daemon
      - name: 压缩免安装版
        shell: bash
        run: |
          cd desktop/build/compose/binaries/main/app
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../../../../../../NEKOPLAY-${{ runner.os }}-portable.zip NEKOPLAY; else zip -qry ../../../../../../NEKOPLAY-${{ runner.os }}-portable.zip .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: NEKOPLAY-${{ runner.os }}-portable
          path: NEKOPLAY-${{ runner.os }}-portable.zip

      # 2) 安装包：Windows 的 jpackage（JDK 21）需要 WiX 3，新版 runner 没预装，先装上
      - name: 安装 WiX 3（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version 3.14.1 -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 打包安装包
        working-directory: desktop
        shell: bash
        run: ./gradlew packageDistributionForCurrentOS --no-daemon
      - name: 出错时打印 jpackage 日志
        if: failure()
        shell: bash
        run: find desktop/build/compose/logs -type f -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: NEKOPLAY-${{ runner.os }}-installer
          path: |
            desktop/build/compose/binaries/main/msi/*
            desktop/build/compose/binaries/main/exe/*
            desktop/build/compose/binaries/main/dmg/*
            desktop/build/compose/binaries/main/deb/*
          if-no-files-found: ignore
