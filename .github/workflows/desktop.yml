name: 打包 PC 版（Windows / macOS / Linux）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      # 1) 免安装版：直接解压就能用，不依赖安装包工具
      - name: 打包免安装版
        working-directory: desktop
        shell: bash
        run: chmod +x gradlew && ./gradlew createDistributable --no-daemon
      - name: 压缩免安装版
        shell: bash
        run: |
          cd desktop/build/compose/binaries/main/app
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../../../../../../NEKOPLAY-${{ runner.os }}-portable.zip NEKOPLAY; else zip -qry ../../../../../../NEKOPLAY-${{ runner.os }}-portable.zip .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: NEKOPLAY-${{ runner.os }}-portable
          path: NEKOPLAY-${{ runner.os }}-portable.zip

      # 2) 安装包：Windows 的 jpackage（JDK 21）需要 WiX 3，新版 runner 没预装，先装上
      - name: 安装 WiX 3（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version 3.14.1 -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 打包安装包
        working-directory: desktop
        shell: bash
        run: ./gradlew packageDistributionForCurrentOS --no-daemon
      - name: 出错时打印 jpackage 日志
        if: failure()
        shell: bash
        run: find desktop/build/compose/logs -type f -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: NEKOPLAY-${{ runner.os }}-installer
          path: |
            desktop/build/compose/binaries/main/msi/*
            desktop/build/compose/binaries/main/exe/*
            desktop/build/compose/binaries/main/dmg/*
            desktop/build/compose/binaries/main/deb/*
          if-no-files-found: ignore
