name: 打包 iOS（未签名 IPA）
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/build.gradle.kts') }}
      - name: 链接 iOS 可执行文件
        working-directory: ios
        run: chmod +x gradlew && ./gradlew linkReleaseExecutableIosArm64 --no-daemon --stacktrace
      - name: 打包 IPA
        working-directory: ios
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with: { name: NEKOPLAY-iOS, path: ios/build/ipa/NEKOPLAY-ios-unsigned.ipa }

  # 检查 Xcode 工程（ios/iosApp）能编译（不签名）
  xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/build.gradle.kts') }}
      - name: xcodebuild（不签名）
        working-directory: ios/iosApp
        run: |
          chmod +x ../gradlew
          set -o pipefail; xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build | tail -60
          test -f build/Release-iphoneos/NEKOPLAY.app/NEKOPLAY
