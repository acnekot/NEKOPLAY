name: 打包 iOS（未签名 IPA）
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/build.gradle.kts') }}
      - name: 链接 iOS 可执行文件
        working-directory: ios
        run: chmod +x gradlew && ./gradlew linkReleaseExecutableIosArm64 --no-daemon --stacktrace
      - name: 打包 IPA
        working-directory: ios
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with: { name: NEKOPLAY-iOS, path: ios/build/ipa/NEKOPLAY-ios-unsigned.ipa }
