name: 代码检查（架构分层 + 三端编译）
on:
  pull_request:
    branches: [main, PLUGIN]
  push:
    branches: [main, PLUGIN]
  workflow_dispatch:

jobs:
  arch-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: 架构守门检查 + 桌面端编译与单测
        working-directory: desktop
        run: chmod +x gradlew && ./gradlew archCheck compileKotlin test --no-daemon

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: 安卓端编译校验
        # 依赖仓库偶发拉取失败（Maven 404 / 仓库被临时禁用）时等 20 秒重试一次，真正的编译错误两次都会失败
        run: |
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin --no-daemon || { echo "::warning::第一次失败，20 秒后重试"; sleep 20; ./gradlew :app:compileReleaseKotlin --no-daemon; }

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: iOS 端编译校验
        working-directory: ios
        run: chmod +x gradlew && ./gradlew compileKotlinIosArm64 --no-daemon
