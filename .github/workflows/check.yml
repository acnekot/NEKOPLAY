name: 代码检查（架构分层 + 三端编译）
on:
  pull_request:
    branches: [main, PLUGIN]
  push:
    branches: [main, PLUGIN]
  workflow_dispatch:

jobs:
  arch-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 插件脚本语法与订阅列表一致性
        run: |
          for f in plugins/*.js; do node --check "$f" || exit 1; done
          python3 plugins/gen-index.py
          git diff --exit-code plugins/index.json
      - name: 架构守门检查 + 桌面端编译与单测
        working-directory: desktop
        run: chmod +x gradlew && ./gradlew archCheck compileKotlin test --no-daemon

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 安卓端编译校验
        run: chmod +x gradlew && ./gradlew :app:compileReleaseKotlin --no-daemon

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: iOS 端编译校验
        working-directory: ios
        run: chmod +x gradlew && ./gradlew compileKotlinIosArm64 --no-daemon
