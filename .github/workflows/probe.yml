name: probe libmpv
on: { push: { branches: [probe-mpv] } }
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir t && cd t
          gh release download v0.7.3 -R media-kit/libmpv-darwin-build --pattern "libmpv-libs_v0.7.3_macos-universal-audio-default.tar.gz"
          tar xzf *.tar.gz; find . | head -40
          for f in $(find . -name "*.dylib" -type f | head -40); do echo "== $f"; otool -L "$f" | head -14; vtool -show-build "$f" | grep -E "minos" | head -1; lipo -archs "$f"; done
